spring:
  application:
    name: arvie

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:arvie}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
          # [WHY] DB 예외 상세 메시지에 포함된 이메일 등의 로그 노출을 방지
          log:
            errors: false

jwt:
  issuer: arvie # [NOTE] 발급 토큰의 iss 클레임에 사용할 서비스 식별값
  secret: ${JWT_SECRET} # [CAUTION] 서명 키는 환경변수로 주입하며 기본값을 두지 않음
  access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:30m} # [NOTE] 별도 환경변수 지정이 없으면 Access Token 유효기간은 30분

auth:
  dummy-password-hash: ${AUTH_DUMMY_PASSWORD_HASH}

ai:
  openai:
    # [NOTE] 키가 없어도 서버는 기동하며 실제 호출 시 설정 여부를 검사
    # [CAUTION] 실제 API 키는 환경변수로만 주입
    api-key: ${OPENAI_API_KEY:}

    # [NOTE] 외부 서버에 연결하기까지 허용할 시간
    connect-timeout: 5s

    # [NOTE] 개별 AI 호출에 적용할 요청 제한 시간
    request-timeout: 30s