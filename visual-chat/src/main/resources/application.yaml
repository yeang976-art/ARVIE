spring:
  application:
    name: arvie

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:arvie}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

jwt:
  issuer: arvie # [NOTE] 발급 토큰의 iss 클레임에 사용할 서비스 식별값
  secret: ${JWT_SECRET} # [CAUTION] 서명 키는 환경변수로 주입하며 기본값을 두지 않음
  access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:30m} # [NOTE] 별도 환경변수 지정이 없으면 Access Token 유효기간은 30분