spring:
  application:
    name: arvie

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:arvie}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC