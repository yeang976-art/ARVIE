name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: visual-chat

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: arvie_test
          POSTGRES_USER: arvie
          POSTGRES_PASSWORD: arvie_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U arvie -d arvie_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      POSTGRES_DB: arvie_test
      POSTGRES_USER: arvie
      POSTGRES_PASSWORD: arvie_ci_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build and test
        run: bash ./gradlew build --no-daemon

      - name: SonarQube analysis
        if: >-
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: bash ./gradlew sonar --no-daemon